# Conversa - coturn
#
# Retransmissor de midia WebRTC. Recebe TURN sobre TCP na porta 3478.
# O TLS e terminado antes de chegar aqui, pelo Tailscale Funnel em teste
# ou pelo nginx da borda em producao. Por isso nao ha certificado aqui.
#
# Roda na rede Docker conversa-rtc (172.30.0.0/24) com IP fixo 172.30.0.10,
# ao lado do MediaMTX em 172.30.0.20. Os dois precisam estar na mesma rede:
# com o MediaMTX fora do Docker o relay nao chega nele (testado, 100% de perda).
#
# ATENCAO: salve sempre como UTF-8 sem BOM. O coturn nao le arquivo com BOM.

# --- Escuta ---------------------------------------------------------------
# Somente TCP. O modo relay-only do cliente usa ?transport=tcp.
listening-port=3478
no-udp
no-tls

# --- Faixa de portas de relay ---------------------------------------------
# Portas usadas so dentro da rede Docker, nao precisam ser publicadas.
# Cada conexao WebRTC relayada consome uma. Uma chamada de 4 pessoas usa 16.
min-port=49160
max-port=49999

# --- Autenticacao ---------------------------------------------------------
# Credenciais temporarias derivadas do segredo por HMAC-SHA1. O backend gera
# um par novo a cada chamada. Nenhuma senha fixa chega ao navegador.
realm=conversa
use-auth-secret
# O static-auth-secret nao fica aqui: o container gera em /dados/turn-segredo,
# no volume conversa-dados, e acrescenta numa copia deste arquivo ao iniciar.

# --- Restricao de destino -------------------------------------------------
# Sem isto o relay fica aberto para qualquer destino e vira proxy de spam e
# varredura em poucos dias. O unico destino permitido e o MediaMTX.
denied-peer-ip=0.0.0.0-172.30.0.19
denied-peer-ip=172.30.0.21-255.255.255.255

# --- Endurecimento --------------------------------------------------------
# Relay so por UDP, e so para o MediaMTX.
no-tcp-relay
no-multicast-peers
fingerprint
