# Conversa - nginx de producao, em container
#
# Sobe com o perfil producao do docker-compose.yml:
#   docker compose --profile producao up -d
#
# Entrega o frontend compilado (bin/web) e repassa para o backend Delphi, que
# roda no Windows fora do Docker, e para o MinIO e o MediaMTX, que estao no
# compose. O nginx da borda termina o TLS e repassa para a porta 80.
#
# Em desenvolvimento este arquivo nao e usado: o Vite faz o mesmo papel.

worker_processes auto;

events {
    worker_connections 4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile          on;
    tcp_nopush        on;
    keepalive_timeout 65;
    server_tokens     off;

    client_max_body_size 1m;

    # Dentro do Docker toda conexao chega pelo gateway da rede, nunca com o IP
    # do cliente. O IP real vem da borda em X-Forwarded-For. Acesso direto, sem
    # a borda, aparece como o gateway.
    set_real_ip_from  172.16.0.0/12;
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;

    # A borda termina o TLS, entao $scheme aqui e sempre http.
    map $http_x_forwarded_proto $proto_original {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Cache do SPA: arquivos com hash do Vite ficam em cache para sempre,
    # paginas e service worker nunca, para o deploy aparecer na hora.
    map $uri $cache_control {
        ~^/assets/                 "public, max-age=31536000, immutable";
        ~\.html$                   "no-store";
        /firebase-messaging-sw.js  "no-store";
        default                    "";
    }

    gzip            on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied    any;
    gzip_vary       on;
    gzip_types      text/plain text/css application/javascript application/json image/svg+xml font/woff2;

    # Backend Delphi no Windows, alcancado pelo host do Docker
    upstream api_upstream      { server host.docker.internal:8080; }
    upstream ws_upstream       { server host.docker.internal:9090; }
    # Servicos do compose, pelo nome
    upstream minio_upstream    { server minio:9000; }
    upstream mediamtx_upstream { server mediamtx:8889; }

    limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

    server {
        listen 80;
        server_name _;

        root  /usr/share/nginx/html;
        index index.html;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options        "SAMEORIGIN" always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
        add_header Cache-Control          $cache_control always;

        # Valem para todos os proxy_pass abaixo. Nenhuma location redefine
        # proxy_set_header, senao estas deixariam de ser herdadas.
        # O Host original e obrigatorio em /storage/: o MinIO valida a
        # assinatura da URL com ele.
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proto_original;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        location = /api/login {
            limit_req zone=login burst=5 nodelay;
            proxy_pass http://api_upstream;
        }

        location /api/ {
            proxy_pass http://api_upstream;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location /ws/ {
            proxy_pass http://ws_upstream/;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        location /storage/ {
            proxy_pass http://minio_upstream/;
            client_max_body_size    1024m;
            proxy_request_buffering off;
            proxy_buffering         off;
            proxy_read_timeout      600s;
            proxy_send_timeout      600s;
        }

        location /webrtc/ {
            proxy_pass http://mediamtx_upstream/;
            proxy_buffering    off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location ~ /\. {
            return 404;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
