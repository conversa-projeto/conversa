# Desenvolvimento: a pagina vem do Vite (npm run dev) no container dev.
# O nome e resolvido a cada requisicao, entao o nginx sobe mesmo com o Vite
# parado, e a pagina volta sozinha quando ele iniciar. A recarga automatica
# passa pelo mesmo caminho, por WebSocket.
location / {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $vite http://dev:5173;
    proxy_pass $vite;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    error_page 502 504 = @vite_parado;
}

location @vite_parado {
    default_type text/plain;
    return 502 "O Vite nao esta rodando. Abra a pasta conversa no VS Code (Dev Container): ele sobe o Vite sozinho.\n";
}
