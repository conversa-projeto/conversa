# Desenvolvimento: HTTPS aqui mesmo, com o certificado do bin\setup-cert.bat.
listen 443 ssl;
ssl_certificate     /etc/nginx/cert/cert.pem;
ssl_certificate_key /etc/nginx/cert/key.pem;

# Endereco digitado com http:// nesta porta: redireciona para https://.
error_page 497 =301 https://$host$request_uri;
