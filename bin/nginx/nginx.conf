# Conversa - nginx, o mesmo em desenvolvimento e producao
#
# Repassa para a API, o MinIO e o MediaMTX, todos no compose. So duas coisas
# mudam com o modo (CONVERSA_MODO), em bin/nginx/desenvolvimento ou producao:
#   servidor.conf  porta e certificado (HTTPS aqui em desenvolvimento,
#                  na borda em producao)
#   pagina.conf    a pagina (Vite em desenvolvimento, bin/web em producao)

worker_processes auto;

events {
    worker_connections 4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile          on;
    tcp_nopush        on;
    keepalive_timeout 65;
    server_tokens     off;

    client_max_body_size 1m;

    # Dentro do Docker toda conexao chega pelo gateway da rede, nunca com o IP
    # do cliente. O IP real vem da borda em X-Forwarded-For. Acesso direto, sem
    # a borda, aparece como o gateway.
    set_real_ip_from  172.16.0.0/12;
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;

    # Em producao a borda termina o TLS e informa o protocolo original. Em
    # desenvolvimento o TLS e aqui mesmo, e vale o $scheme.
    map $http_x_forwarded_proto $proto_original {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Cache do SPA: arquivos com hash do Vite ficam em cache para sempre,
    # paginas e service worker nunca, para o deploy aparecer na hora.
    map $uri $cache_control {
        ~^/assets/                 "public, max-age=31536000, immutable";
        ~\.html$                   "no-store";
        /firebase-messaging-sw.js  "no-store";
        default                    "";
    }

    gzip            on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied    any;
    gzip_vary       on;
    gzip_types      text/plain text/css application/javascript application/json image/svg+xml font/woff2;

    # Servicos do compose, pelo nome
    upstream api_upstream      { server api:8080; }
    upstream minio_upstream    { server minio:9000; }
    upstream mediamtx_upstream { server mediamtx:8889; }

    limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

    server {
        include /etc/nginx/modo/servidor.conf;
        server_name _;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options        "SAMEORIGIN" always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
        add_header Cache-Control          $cache_control always;

        # Valem para todos os proxy_pass abaixo. Nenhuma location redefine
        # proxy_set_header, senao estas deixariam de ser herdadas.
        # O Host original e obrigatorio em /storage/: o MinIO valida a
        # assinatura da URL com ele.
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proto_original;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        location = /api/login {
            limit_req zone=login burst=5 nodelay;
            proxy_pass http://api_upstream;
        }

        location /api/ {
            proxy_pass http://api_upstream;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # WebSocket na mesma porta da API, no caminho /ws/.
        location /ws/ {
            proxy_pass http://api_upstream;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        location /storage/ {
            proxy_pass http://minio_upstream/;
            client_max_body_size    1024m;
            proxy_request_buffering off;
            proxy_buffering         off;
            proxy_read_timeout      600s;
            proxy_send_timeout      600s;
        }

        location /webrtc/ {
            proxy_pass http://mediamtx_upstream/;
            proxy_buffering    off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        include /etc/nginx/modo/pagina.conf;
    }
}
