# Conversa - servicos em Docker
#
#   bin\desenvolvimento.bat     desenvolvimento (com o docker-compose.override.yml,
#                               a API reinicia sozinha ao salvar)
#   bin\producao.bat            producao (so este arquivo)
#   docker compose ps           estado dos servicos
#   docker compose logs -f api  logs de um servico
#   docker compose down         para tudo, mantendo os dados
#
# O modo vem de CONVERSA_MODO (desenvolvimento, o padrao, ou producao), que o
# producao.bat define. O nginx e o mesmo nos dois: em desenvolvimento termina o
# HTTPS na 443 e pega a pagina do Vite; em producao escuta na 80, atras da
# borda, e entrega bin/web.
#
# Segredos gerados na primeira execucao, no volume conversa-dados: pepper das
# senhas, credenciais do MinIO e segredo do TURN. Esse volume precisa entrar
# no backup junto com o banco: sem o pepper nenhum login confere.
#
# Portas publicadas so em 127.0.0.1, exceto o nginx e o TURN na 3478, que
# precisam ser alcancados por navegadores de fora.
#
# A senha do PostgreSQL pode ser trocada num arquivo .env ao lado deste
# (POSTGRES_PASSWORD). As credenciais do MinIO sao geradas, veja o servico.

name: conversa

services:

  # Publicado na 5433: a 5432 costuma estar ocupada por um PostgreSQL ja
  # instalado na maquina. Dentro do Docker a API usa postgres:5432.
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    restart: always
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-root}
      TZ: UTC
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Usuario e senha do MinIO sao gerados aleatorios na primeira vez e ficam em
  # /dados, no volume conversa-dados, que a API tambem le. Depois so sao lidos.
  # O dono uid 1000 e o usuario node da API, que tambem grava o pepper ali.
  minio:
    image: quay.io/minio/minio
    container_name: minio
    restart: always
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        mkdir -p /dados
        [ -s /dados/minio-usuario ] || head -c 12 /dev/urandom | od -An -tx1 | tr -d ' \n' > /dados/minio-usuario
        [ -s /dados/minio-senha ] || head -c 32 /dev/urandom | base64 | tr -d '+/=\n' > /dados/minio-senha
        chown 1000:1000 /dados /dados/minio-usuario /dados/minio-senha
        chmod 600 /dados/minio-usuario /dados/minio-senha
        export MINIO_ROOT_USER="$$(cat /dados/minio-usuario)"
        export MINIO_ROOT_PASSWORD="$$(cat /dados/minio-senha)"
        exec /usr/bin/docker-entrypoint.sh minio server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio:/data
      - dados:/dados
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Retransmissor TURN. Configuracao em bin/coturn/turnserver.conf.
  # O IP fixo importa: o turnserver.conf so permite relay ate o MediaMTX.
  # O segredo e gerado na primeira vez em /dados/turn-segredo, que a API tambem
  # le, e entra numa copia da configuracao. Inicia como root so para isso: o
  # turnserver troca para nobody logo em seguida.
  coturn:
    image: coturn/coturn
    container_name: coturn
    restart: always
    user: root
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        mkdir -p /dados
        [ -s /dados/turn-segredo ] || head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n' > /dados/turn-segredo
        chown 1000:1000 /dados /dados/turn-segredo
        chmod 600 /dados/turn-segredo
        cp /etc/coturn/turnserver.conf /tmp/turnserver.conf
        printf '\nstatic-auth-secret=%s\n' "$$(cat /dados/turn-segredo)" >> /tmp/turnserver.conf
        exec turnserver -c /tmp/turnserver.conf --proc-user=nobody --proc-group=nogroup
    ports:
      - "3478:3478/tcp"
    volumes:
      - ./bin/coturn:/etc/coturn:ro
      - dados:/dados
    networks:
      rtc:
        ipv4_address: 172.30.0.10

  # Servidor WebRTC. Precisa estar na mesma rede do coturn, com este IP fixo.
  # O nginx chega nele pelo nome.
  mediamtx:
    image: bluenviron/mediamtx:1.16.2
    container_name: mediamtx
    restart: always
    command: /config/mediamtx.docker.yml
    ports:
      - "127.0.0.1:8889:8889/tcp"
    volumes:
      - ./bin/mediamtx:/config:ro
    networks:
      rtc:
        ipv4_address: 172.30.0.20

  # API em Node. HTTP e WebSocket, em /ws/, na porta 8080. O nginx chega nela
  # pelo nome; a porta em 127.0.0.1 serve para testes locais.
  api:
    build: .
    image: conversa-api
    container_name: api
    restart: always
    environment:
      CONVERSA_SERVER: postgres
      CONVERSA_DATABASE: ${CONVERSA_DATABASE:-conversa}
      CONVERSA_USERNAME: postgres
      CONVERSA_PASSWORD: ${POSTGRES_PASSWORD:-root}
      # Chamadas do servidor ao MinIO vao direto pela rede do Docker.
      CONVERSA_S3_INTERNO: http://minio:9000
      # Producao: porta publica da borda para o TURN, com TLS terminado la.
      # Vazio (desenvolvimento) usa o coturn direto na 3478.
      CONVERSA_TURN_PORTA: ${CONVERSA_TURN_PORTA:-}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - dados:/dados
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  # nginx, ponto de entrada nos dois modos. Configuracao em bin/nginx/nginx.conf,
  # com a parte que muda em bin/nginx/desenvolvimento ou bin/nginx/producao.
  # Porta: 443 com HTTPS em desenvolvimento, 80 em producao (CONVERSA_PORTA).
  nginx:
    image: nginx:1.28-alpine
    container_name: nginx
    restart: always
    command: ["nginx", "-c", "/etc/nginx/conversa/nginx.conf", "-g", "daemon off;"]
    ports:
      - "${CONVERSA_PORTA:-443}:${CONVERSA_PORTA:-443}"
    volumes:
      - ./bin/nginx:/etc/nginx/conversa:ro
      - ./bin/nginx/${CONVERSA_MODO:-desenvolvimento}:/etc/nginx/modo:ro
      - ./bin/cert:/etc/nginx/cert:ro
      - ./bin/web:/usr/share/nginx/html:ro
    depends_on:
      - api
      - minio
      - mediamtx
    networks:
      - default
      - rtc

networks:
  rtc:
    name: conversa-rtc
    ipam:
      config:
        - subnet: 172.30.0.0/24

# Nomes fixos para reaproveitar os volumes criados pelos antigos setup-*.bat.
volumes:
  pgdata:
    name: pgdata
  minio:
    name: minio
  dados:
    name: conversa-dados
